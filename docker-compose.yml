version: '3'

services:
  rag-service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - lancedb-data:/app/lancedb
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  lancedb-data:
    # This named volume persists the LanceDB data between container restarts
